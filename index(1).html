<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2f8a">
<title>SR Play</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",system-ui,Roboto,sans-serif;color:#fff;background:#0b2f8a}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;user-select:text}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.pat{background:
 repeating-linear-gradient(35deg,#ffffff0d 0 40px,transparent 40px 80px),
 repeating-linear-gradient(-55deg,#00000014 0 40px,transparent 40px 80px),
 radial-gradient(circle at 50% 40%,#2f6fe0,#123a9e 70%,#0a2370)}
.pat.red{background:repeating-linear-gradient(35deg,#ffffff0a 0 40px,transparent 40px 80px),repeating-linear-gradient(-55deg,#00000018 0 40px,transparent 40px 80px),radial-gradient(circle at 50% 40%,#c7322b,#8e1712 70%,#5a0b08)}
.pat.dark{background:repeating-linear-gradient(35deg,#ffffff08 0 40px,transparent 40px 80px),radial-gradient(circle at 50% 40%,#2c2c44,#121225 70%,#06060f)}
.pat.green{background:repeating-linear-gradient(35deg,#ffffff0a 0 40px,transparent 40px 80px),radial-gradient(circle at 50% 40%,#1f9a5a,#0d5e34 70%,#06371e)}
.gold{color:#ffd23f;text-shadow:0 2px 0 #7a4b00,0 0 2px #000}
.out{text-shadow:-2px -2px 0 #102a6b,2px -2px 0 #102a6b,-2px 2px 0 #102a6b,2px 2px 0 #102a6b,0 3px 0 #102a6b}
/* splash */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.logo{display:flex;align-items:flex-end;gap:6px;filter:drop-shadow(0 6px 0 #0006)}
.logo b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#fff;font-size:40px;font-weight:900;border:5px solid}
.logo .l1{color:#e53935;border-color:#e53935}.logo .l2{color:#1e88e5;border-color:#1e88e5}
.logo .pl{font-size:46px;font-weight:900;margin-left:6px;line-height:62px}
.spin{width:44px;height:44px;border:5px solid #fff3;border-top-color:#2ecc71;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#welcome{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#202124ee;border-radius:40px;padding:10px 26px 10px 10px;display:none;align-items:center;gap:12px;z-index:50;font-size:18px;white-space:nowrap}
#welcome .av{width:52px;height:52px;font-size:30px}
/* top bar */
.top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(#1a3fa8,#0e2a78);border-bottom:3px solid #f5b70e;z-index:3}
.av{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:28px;border:3px solid #f5b70e;background:#b03a2e;position:relative;flex:none}
.av .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#2ecc71;border:2px solid #fff}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.cur{flex:1;display:flex;align-items:center;justify-content:space-between;background:#071a52;border-radius:20px;height:36px;padding:0 4px 0 10px;font-weight:900;font-size:19px;min-width:0}
.cur .p{width:28px;height:28px;border-radius:7px;background:#2ecc71;display:grid;place-items:center;font-size:22px;line-height:1;box-shadow:inset 0 -3px #1a9a52}
/* home */
.home{position:absolute;top:64px;bottom:74px;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 20px}
.side{position:absolute;top:76px;display:flex;flex-direction:column;gap:14px;z-index:2}
.side.l{left:8px}.side.r{right:8px}
.rnd{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(#ffe27a,#d48a00);border:3px solid #fff4;box-shadow:0 4px 0 #0005;position:relative}
.rnd small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;color:#ffd23f;text-shadow:0 1px 2px #000}
.title{margin:8px auto 12px;text-align:center}
.tl-board{width:150px;height:84px;margin:-6px auto 0;position:relative}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:440px;margin:0 auto}
.grid.g3{grid-template-columns:repeat(3,1fr);gap:10px}
.card{border-radius:18px;background:#f8b915;padding:6px 6px 0;box-shadow:0 5px 0 #a86a00,0 8px 12px #0006;border:3px solid #ffdd6a;position:relative}
.card .ic{height:74px;border-radius:12px 12px 4px 4px;background:linear-gradient(#2f72e0,#1747b0);display:grid;place-items:center;font-size:42px;box-shadow:inset 0 -6px #0003}
.red .card .ic{background:linear-gradient(#1f8f88,#0d5f5a)}
.card .lb{font-size:19px;font-weight:900;text-align:center;padding:7px 2px 9px;color:#fff;line-height:1.05}
.card .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#d32222;border:2px solid #fff;border-radius:8px;padding:1px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.under{text-align:center;font-size:13px;color:#7dff8a;font-weight:700;margin-top:6px;text-shadow:0 1px 2px #000}
.row3{display:flex;justify-content:center;gap:26px;margin:20px 0 8px;align-items:center}
.sq{width:76px;height:70px;border-radius:22px;background:linear-gradient(#ffd85a,#e09a00);display:grid;place-items:center;font-size:36px;box-shadow:0 5px 0 #8a5600;border:3px solid #fff5}
.wide{display:block;margin:14px auto 0;padding:12px 30px;border-radius:30px;font-size:24px;font-weight:900;background:linear-gradient(#ffd85a,#f08a00);box-shadow:0 5px 0 #8a4a00;color:#7a2a00;border:3px solid #fff6}
.float{position:absolute;bottom:84px;z-index:2;text-align:center;font-weight:900}
.float.l{left:10px}.float.r{right:10px}
/* bottom nav */
.nav{position:absolute;bottom:0;left:0;right:0;height:74px;display:flex;background:linear-gradient(#1c4fc0,#0c2a78);border-top:3px solid #0a1d55;z-index:3}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:900;gap:2px;border-right:1px solid #0003}
.nav button i{font-style:normal;font-size:28px;line-height:1}
.nav button.on{background:linear-gradient(#3c86ff,#1956d4);border-radius:14px 14px 0 0;margin-top:-8px}
.red .nav{background:linear-gradient(#138a83,#0a5a55);border-top-color:#063b38}
.red .nav button.on{background:linear-gradient(#2bb3aa,#138a83)}
.red .top{background:linear-gradient(#138a83,#0a5a55)}
/* modal */
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
.modal.on{display:flex}
.box{width:min(440px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#1a4bb8,#0b2a78);border:3px solid #f5b70e;border-radius:14px;padding:14px;position:relative;box-shadow:0 0 30px #f5b70e55}
.box h2{margin:0 auto 14px;width:max-content;max-width:100%;padding:6px 26px;background:linear-gradient(#e8402f,#a91d12);border-radius:10px;font-size:24px;border:2px solid #ffd23f}
.box .x{position:absolute;top:6px;right:8px;font-size:22px;width:34px;height:34px;border-radius:50%;background:#d32222;border:2px solid #fff}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0d2a7c;border-radius:8px;padding:9px 10px;margin:7px 0;font-weight:900;font-size:17px;color:#9cc4ff}
.pill{padding:6px 16px;border-radius:20px;background:linear-gradient(#3d7cff,#1645b8);border:2px solid #ffd23f;font-weight:900;color:#fff;font-size:15px}
.tg{width:44px;height:44px;border-radius:50%;border:3px solid #ffd23f;background:#1645b8;font-size:20px;display:grid;place-items:center}
.tg.off{filter:grayscale(1) brightness(.6)}
.btn{display:block;width:100%;padding:12px;border-radius:12px;font-size:20px;font-weight:900;background:linear-gradient(#5bd34a,#2c9a1c);box-shadow:0 4px 0 #1a6410;margin-top:12px;text-shadow:0 1px 2px #0008}
.btn.y{background:linear-gradient(#ffd85a,#e09a00);box-shadow:0 4px 0 #8a5600;color:#5a2a00;text-shadow:none}
.btn.r{background:linear-gradient(#f05a4a,#b32014);box-shadow:0 4px 0 #6d0f08}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.opt{padding:10px 16px;border-radius:12px;background:#0d2a7c;border:3px solid #3d6fd8;font-weight:900;font-size:17px}
.opt.on{border-color:#ffd23f;background:#1f53d0}
.cdot{width:46px;height:46px;border-radius:50%;border:4px solid #fff4}
.cdot.on{border-color:#fff;box-shadow:0 0 0 3px #ffd23f}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:230px;overflow:auto;padding:4px;background:#071a52;border-radius:10px}
.avs button{aspect-ratio:1;border-radius:10px;font-size:30px;border:3px solid #ffb300;background:#2a5bd0}
.avs button.on{border-color:#ff3030;box-shadow:0 0 0 2px #fff}
.inp{width:100%;padding:10px 14px;border-radius:12px;border:3px dashed #c0392b;font-size:20px;font-weight:900;text-align:center;color:#111;background:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;padding:10px 20px;border-radius:24px;font-weight:700;z-index:60;opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:90%}
/* login */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#login .card2{width:min(400px,100%);background:#0b2560;border:3px solid #f5b70e;border-radius:14px;padding:14px}
.feat{display:flex;gap:6px}.feat div{flex:1;border:2px solid #2f6fe0;border-radius:10px;padding:6px;text-align:center;font-weight:900;font-size:14px;background:#103080}
/* game screens */
.gtop{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:3}
.back{width:44px;height:44px;border-radius:12px;background:linear-gradient(#ffd85a,#e09a00);display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 #8a5600;color:#5a2a00;font-weight:900}
canvas{display:block}
#lcv,#scv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:8px;box-shadow:0 0 0 4px #0b1f5c,0 10px 30px #000a}
.pp{position:absolute;display:flex;align-items:center;gap:6px;z-index:2;transition:.2s}
.pp .av{width:50px;height:50px;font-size:28px}
.pp .nm{font-size:13px;font-weight:900;max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.dice{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;box-shadow:0 4px 0 #aaa,0 0 0 3px #0003;flex:none}
.dice i{width:10px;height:10px;border-radius:50%;background:#111;place-self:center;visibility:hidden}
.dice.v i.s{visibility:visible}
.pp.act .dice{animation:pulse .8s infinite;box-shadow:0 4px 0 #aaa,0 0 0 4px #ffd23f}
.pp:not(.act) .dice{opacity:.35}
.pp.done{filter:grayscale(.6)}
.pp .rk{font-size:22px}
@keyframes pulse{50%{transform:scale(1.08)}}
.dice.roll{animation:dr .12s linear infinite}
@keyframes dr{50%{transform:rotate(25deg) scale(.9)}}
.arrow{position:absolute;font-size:30px;animation:bob .6s infinite alternate;z-index:4;pointer-events:none}
@keyframes bob{to{transform:translateY(-8px)}}
.ginfo{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:16px;text-shadow:0 2px 3px #000;z-index:2}
/* runner */
#rcv{position:absolute;inset:0}
#rhud{position:absolute;inset:0;pointer-events:none}
#rhud>*{position:absolute}
#rscore{top:10px;right:10px;background:#0006;border-radius:12px;padding:4px 12px;font-size:30px;font-weight:900;text-align:right}
#rscore small{color:#ffd23f;font-size:24px}
#rcoins{top:58px;right:10px;background:#0006;border-radius:12px;padding:2px 12px;font-size:24px;font-weight:900}
#rpause{top:10px;left:10px;pointer-events:auto;width:54px;height:54px;border-radius:12px;background:linear-gradient(#7fd0ff,#2b8be0);font-size:26px;border:3px solid #fff;font-weight:900}
.pw{bottom:16px;display:flex;align-items:center;gap:6px}
.pw b{width:52px;height:52px;border-radius:10px;background:linear-gradient(#5cc4ff,#1a6fd0);display:grid;place-items:center;font-size:28px;border:3px solid #fff}
.pw div{width:110px;height:24px;border-radius:12px;background:#1d2a55;border:3px solid #fff;overflow:hidden}
.pw div span{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffe02a 0 9px,#1d2a55 9px 12px)}
#rmsg{left:0;right:0;top:38%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 6px #000}
#rhome{display:none;position:absolute;inset:0;pointer-events:auto}
.ttp{position:absolute;left:24px;bottom:110px;font-size:40px;font-weight:900;transform:rotate(-4deg);text-shadow:0 4px 0 #2a3a80,0 0 4px #000;animation:pulse 1.2s infinite}
.rbar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px;background:linear-gradient(#5e8cc8,#3b64a8)}
.rbar .cur{background:#1d2a55}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop button{background:#dfeaff;border-radius:12px;padding:6px;color:#223;font-weight:900;font-size:13px;border:3px solid transparent}
.shop button.on{border-color:#2ecc71}
.shop canvas{width:100%;height:auto}
#wheel{display:block;margin:6px auto;max-width:100%}
.res{text-align:center}
.res .big{font-size:46px;margin:6px}
.res .t{font-size:26px;font-weight:900}
.lb{}
table.lbt{width:100%;border-collapse:collapse;font-weight:900}
table.lbt td{padding:8px;border-bottom:1px solid #fff2}
</style></head><body>

 </div>

 <div class="home">

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const AVS=['👨🏻‍🦱','👩🏻','🧑🏽','👨🏽‍🦰','👩🏽‍🦱','🧔🏻','👨🏻‍💼','👩🏻‍💼','🧑🏻‍🎓','👩🏻‍🎤','👨🏽‍🍳','👩🏽‍⚕️','👨🏻‍✈️','👮🏽','🥷🏻','🧕🏽','👳🏽‍♂️','🤴🏽','👸🏻','🧙🏻‍♂️','🦸🏽‍♂️','🦹🏻‍♀️','🧛🏻','🤠','😎','🐯','🦁','🐼','🦊','🐵'];
const AVBG=['#b03a2e','#2e7d32','#1565c0','#6a1b9a','#ef6c00','#00838f','#ad1457','#4e342e'];
const BOTN=['Rahul','Priya','Aman','Sneha','Vikas','Pooja','Rohit','Neha','Arjun','Kavya','Sanjay','Riya','Deepak','Anjali','Karan','Simran'];
const COUNTRIES=['🇮🇳 India','🇳🇵 Nepal','🇧🇩 Bangladesh','🇱🇰 Sri Lanka','🇦🇪 UAE','🇸🇦 Saudi Arabia','🇺🇸 USA','🇬🇧 UK','🇨🇦 Canada','🌍 Other'];

// ---------- save data ----------
const D=Object.assign({name:'',av:0,avbg:0,coins:2250,gems:50,xp:0,country:'',gender:0,snd:1,mus:1,vib:1,lang:'en',theme:0,
 spinAt:0,freeAt:0,claimAt:0,wins:{ludo:0,snakes:0},played:0,rbest:0,rkeys:0,rboards:3,rchar:0,rown:[0],mission:0,dice:0,downs:[0]},JSON.parse(localStorage.srplay||'{}'));
const save=()=>{localStorage.srplay=JSON.stringify(D);ui()};
const level=()=>1+Math.floor(Math.sqrt(D.xp/40));
function addCoins(n){D.coins=Math.max(0,D.coins+n);save()}
function addXp(n){const l=level();D.xp+=n;save();if(level()>l){toast('🎉 Level '+level()+'! +500 🪙');addCoins(500)}}

// ---------- language ----------
const TX={hi:{online:'ऑनलाइन',team:'टीम अप',friends:'दोस्त',computer:'कंप्यूटर',pass:'पास एन प्ले',playonline:'ऑनलाइन खेलें',playfriends:'दोस्तों के साथ',claim:'क्लेम',login:'लॉगिन करें'}};
function lang(){$$('[data-t]').forEach(e=>{e.dataset.en=e.dataset.en||e.textContent;e.textContent=D.lang==='hi'&&TX.hi[e.dataset.t]?TX.hi[e.dataset.t]:e.dataset.en})}

// ---------- sound ----------
let AC;
function beep(f=440,d=.08,type='square',v=.06){if(!D.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const SFX={dice:()=>{for(let i=0;i<4;i++)setTimeout(()=>beep(200+rnd(300),.04,'triangle'),i*60)},step:()=>beep(660,.05,'sine',.05),cut:()=>{beep(180,.25,'sawtooth',.08)},home:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine',.07),i*90))},coin:()=>beep(1200,.06,'sine',.05),win:()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.08),i*120))},bad:()=>beep(120,.3,'sawtooth',.08),up:()=>{[400,500,600,800].forEach((f,i)=>setTimeout(()=>beep(f,.08,'sine'),i*60))}};
let music=null;
function startMusic(){if(!D.mus||music)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const notes=[262,330,392,330,294,349,440,349];let i=0;music=setInterval(()=>{if(!D.mus)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=notes[i++%8]/2;g.gain.value=.018;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)},450)}catch(e){}}
function stopMusic(){clearInterval(music);music=null}
const buzz=ms=>D.vib&&navigator.vibrate&&navigator.vibrate(ms);

function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2300)}
function ui(){$$('.coins').forEach(e=>e.textContent=D.coins.toLocaleString('en-IN'));$$('.gems').forEach(e=>e.textContent=D.gems);
 $$('.avi').forEach(e=>e.textContent=AVS[D.av]);$$('.av[data-act=profile]').forEach(e=>e.style.background=AVBG[D.avbg]);
 $$('.lvtxt').forEach(e=>e.textContent='Level '+level());$$('.pname').forEach(e=>e.textContent=D.name);
 $('#rkeys').textContent=D.rkeys;$('#rboards').textContent=D.rboards;$('#rbest').textContent=D.rbest;
 ['lhome','shome'].forEach(id=>{const el=$('#'+id);el.classList.remove('dark','green');if(id==='lhome'&&D.theme)el.classList.add(['','dark','green'][D.theme])})}

// ---------- screens ----------
let cur='splash',game=null;
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));cur=id;if(id==='rgame')R.home();ui()}
function modal(html,cls){$('#mbox').innerHTML=html+'<button class="x" data-act="close">✕</button>';$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

// ---------- boot ----------
setTimeout(()=>{if(D.name){welcome();show('lhome')}else show('login')},1500);
function welcome(){$('#wav').textContent=AVS[D.av];$('#wav').style.background=AVBG[D.avbg];$('#wnm').textContent='Hey there, '+D.name;$('#wlv').textContent='Level '+level();const w=$('#welcome');w.style.display='flex';setTimeout(()=>w.style.display='none',2600)}
$('#lgo').onclick=()=>{const n=$('#lname').value.trim();if(!n)return toast('Naam likho');D.name=n;D.gems+=100;save();welcome();show('lhome')};
$('#lguest').onclick=()=>{D.name='Guest'+(1000+rnd(9000));save();welcome();show('lhome')};

// ---------- actions ----------
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;beep(520,.04,'sine',.04);startMusic();act(b.dataset.act,b)});
function act(a,b){
 switch(a){
 case 'close':closeModal();break;
 case 'home':show(cur==='shome'?'shome':'lhome');break;
 case 'hub':show('hub');break;
 case 'ludo':closeModal();show('lhome');break;
 case 'snakes':closeModal();show('shome');break;
 case 'runner':closeModal();show('rgame');break;
 case 'profile':profileM();break;
 case 'settings':settingsM();break;
 case 'store':storeM();break;
 case 'spin':spinM();break;
 case 'free':freeM();break;
 case 'claim':claimM();break;
 case 'rules':rulesM(cur==='shome'||cur==='sgame'?'s':'l');break;
 case 'lvl':modal(`<h2>LEVEL ${level()}</h2><div class="res"><div class="big">👑</div><div class="t">XP: ${D.xp}</div><p>Agla level: ${Math.pow(level(),2)*40} XP<br>Jeetne par +30 XP, khelne par +10 XP</p><p>Ludo wins: ${D.wins.ludo} • Saanp Seedhi wins: ${D.wins.snakes}<br>Runner best: ${D.rbest}</p></div>`);break;
 case 'mail':modal(`<h2>INBOX</h2><div class="srow">🎁 SR Play me swagat hai, ${D.name}!</div><div class="srow">🪙 Roz Spin aur Free coins lena na bhoolein</div>`);break;
 case 'target':missionM();break;
 case 'lucky':luckyM();break;
 case 'tour':tourM();break;
 case 'event':modal(`<h2>EVENT</h2><div class="res"><div class="big">📅</div><p>Is hafte ka event: <b>Ludo me 5 game jeeto</b> aur paao <b class="gold">5000 🪙</b></p><div class="srow">Progress<span>${Math.min(5,D.wins.ludo%6)}/5</span></div></div>`);break;
 case 'adda':modal(`<h2>ADDA</h2><div class="res"><div class="big">🎙️</div><p>Voice chat room ke liye online server chahiye. Jald aa raha hai!</p></div>`);break;
 case 'inv':invM();break;
 case 'social':case 'friendsTab':socialM();break;
 case 'lb':lbM();break;
 case 'lonline':case 'lfriends':case 'sonline':case 'sfriends':onlineM(a[0]);break;
 case 'lcomp':setupM('l','comp');break;
 case 'lpass':setupM('l','pass');break;
 case 'lteam':startLudo({mode:'team',n:4,me:0});break;
 case 'scomp':setupM('s','comp');break;
 case 'spass':setupM('s','pass');break;
 case 'quit':quitGame();break;
 case 'rshop':R.shop();break;
 case 'rhelp':modal(`<h2>KAISE KHELEIN</h2><div class="srow">⬅️➡️ Swipe: lane badlo</div><div class="srow">⬆️ Swipe up: jump (neeche wali barrier)</div><div class="srow">⬇️ Swipe down: roll (upar wali barrier)</div><div class="srow">👆👆 Double tap: Hoverboard (1 takkar se bachata hai)</div><div class="srow">🚆 Train se bacho, 🪙 coins jama karo, 🧲 magnet lo</div>`);break;
 }
}

// ---------- modals ----------
function profileM(){let av=D.av,g=D.gender;
 modal(`<h2>EDIT PROFILE</h2><div style="display:flex;gap:10px;align-items:center"><div class="av" id="pav" style="width:90px;height:90px;font-size:56px;background:${AVBG[D.avbg]}">${AVS[av]}</div><div style="flex:1"><div class="gold" style="font-weight:900">ENTER NAME</div><input class="inp" id="pnm" maxlength="14" value="${D.name.replace(/"/g,'')}"><select id="pct" class="inp" style="margin-top:8px;font-size:16px;border-style:solid">${['🌍 Select Your Country',...COUNTRIES].map(c=>`<option ${c===D.country?'selected':''}>${c}</option>`).join('')}</select></div></div>
 <div class="gold" style="font-weight:900;margin:10px 0 4px">SELECT GENDER</div><div class="opts" id="pgen">${['👤 Male','👩 Female','🌼 Other'].map((t,i)=>`<button class="opt ${i==g?'on':''}" data-g="${i}">${t}</button>`).join('')}</div>
 <div class="gold" style="font-weight:900;margin:6px 0">SELECT PROFILE PICTURE</div><div class="avs" id="pavs">${AVS.map((a,i)=>`<button class="${i==av?'on':''}" data-i="${i}" style="background:${AVBG[i%8]}">${a}</button>`).join('')}</div>
 <button class="btn" id="psave">Save</button>`);
 $('#pavs').onclick=e=>{const t=e.target.closest('button');if(!t)return;av=+t.dataset.i;$$('#pavs button').forEach(x=>x.classList.toggle('on',x===t));$('#pav').textContent=AVS[av];$('#pav').style.background=AVBG[av%8]};
 $('#pgen').onclick=e=>{const t=e.target.closest('button');if(!t)return;g=+t.dataset.g;$$('#pgen button').forEach(x=>x.classList.toggle('on',x===t))};
 $('#psave').onclick=()=>{const n=$('#pnm').value.trim();if(n)D.name=n;D.av=av;D.avbg=av%8;D.gender=g;const c=$('#pct').value;D.country=c.startsWith('🌍 Select')?'':c;save();closeModal();toast('Profile save ho gaya ✔')};
}
function settingsM(){
 const T=(k,ic)=>`<button class="tg ${D[k]?'':'off'}" data-k="${k}">${ic}</button>`;
 modal(`<h2>Settings</h2>
 <div class="srow">Audio ${T('snd','🔊')}</div>
 <div class="srow">Background Music ${T('mus','🎵')}</div>
 <div class="srow">Vibration ${T('vib','📳')}</div>
 <div class="srow">Tutorial <button class="pill" id="stut">Play</button></div>
 <div class="srow">Language <select id="slang" class="pill" style="color:#fff"><option value="en">English</option><option value="hi">हिन्दी</option></select></div>
 <div class="srow">Themes <select id="sth" class="pill" style="color:#fff"><option value="0">Blue</option><option value="1">Dark</option><option value="2">Green</option></select></div>
 <div class="srow">Store <button class="pill" id="sst">View</button></div>
 <div class="srow">Support Email <span style="display:flex;gap:6px"><button class="pill" id="sfaq">FAQ</button><a class="pill" style="text-decoration:none" href="mailto:anilahiryadav123@gmail.com?subject=SR%20Play%20Support">Compose</a></span></div>
 <div class="srow">Game <span style="display:flex;gap:6px"><button class="pill" id="stut2">Tutorial</button><button class="pill" id="srul">Rules</button></span></div>
 <div class="srow">Share <button class="pill" id="sshare">📤 Share</button></div>
 <button class="btn y" data-act="hub">+ More Games</button>
 <button class="btn" id="sinv">🎁 INVITE • GET 10,000</button>`);
 $('#slang').value=D.lang;$('#sth').value=D.theme;
 $$('#mbox .tg').forEach(t=>t.onclick=()=>{const k=t.dataset.k;D[k]=D[k]?0:1;t.classList.toggle('off',!D[k]);if(k==='mus'){D.mus?startMusic():stopMusic()}save()});
 $('#slang').onchange=e=>{D.lang=e.target.value;save();lang()};
 $('#sth').onchange=e=>{D.theme=+e.target.value;save()};
 $('#sst').onclick=storeM;$('#srul').onclick=()=>rulesM(cur==='shome'||cur==='sgame'?'s':'l');$('#stut').onclick=$('#stut2').onclick=()=>rulesM('l');
 $('#sfaq').onclick=()=>modal(`<h2>FAQ</h2><div class="srow" style="display:block">Coins kaise milte hain?<br><small style="color:#fff">Roz Spin, Free gift, Claim aur game jeet kar.</small></div><div class="srow" style="display:block">Data kahan save hai?<br><small style="color:#fff">Isi phone me. App delete karne par data chala jayega.</small></div>`);
 $('#sshare').onclick=$('#sinv').onclick=share;
}
function share(){const t='SR Play khelo – Ludo, Saanp Seedhi aur Runner ek hi app me!';if(navigator.share)navigator.share({title:'SR Play',text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t)}catch(e){}toast('Message copy ho gaya, WhatsApp pe bhejo')}}
function rulesM(g){modal(g==='s'?`<h2>RULES</h2><div class="srow" style="display:block;color:#fff">🎲 Baari baari dice chalao.<br>🪜 Seedhi ke neeche ruke to upar chadh jaoge.<br>🐍 Saanp ke muh par ruke to neeche aa jaoge.<br>🎯 Theek 100 par pahuchna zaroori hai.<br>6 aane par ek aur baari.</div>`:
 `<h2>RULES</h2><div class="srow" style="display:block;color:#fff">🎲 6 aane par goti ghar se bahar nikalti hai.<br>6 aane par ek aur baari milti hai (teen baar 6 = baari khatam).<br>⭐ Star aur start wale ghar safe hain.<br>✂️ Kisi ki goti kaatne par ek aur baari.<br>🏠 Goti ghar pahuchne par ek aur baari.<br>🏆 Chaaron goti pehle ghar pahuchao aur jeeto!<br>⚔️ Team Up: aap + Peela vs Hara + Neela.</div>`)}
function storeM(){modal(`<h2>STORE</h2>
 <div class="srow">🪙 1,000 Coins<button class="pill" data-buy="1000:10">💎 10</button></div>
 <div class="srow">🪙 5,000 Coins<button class="pill" data-buy="5000:40">💎 40</button></div>
 <div class="srow">🪙 20,000 Coins<button class="pill" data-buy="20000:120">💎 120</button></div>
 <div class="srow">🎲 Golden Dice<button class="pill" data-dice="1">🪙 3000</button></div>
 <div class="srow">🎲 Ruby Dice<button class="pill" data-dice="2">🪙 6000</button></div>

async function ludoLoop(my){const G=L,alive=()=>L===G&&cur==='lgame';
 await sleep(500);let sixes=0;
 while(alive()&&!G.over){const p=G.players[G.turn];if(p.rank){nextTurn(G);continue}
  setAct();G===L&&info(p.bot?p.name+' ki baari...':(G.mode==='pass'?p.name+', dice dabao':'Aapki baari – dice dabao 🎲'));
  G.state='wroll';
  if(p.bot)await sleep(700);else{await new Promise(r=>G.res=r);}
  if(!alive())return;
  G.state='rolling';SFX.dice();p.dice.classList.add('roll');const fr=setInterval(()=>setFace(p.dice,1+rnd(6)),70);await sleep(600);clearInterval(fr);p.dice.classList.remove('roll');
  const r=1+rnd(6);setFace(p.dice,r);G.roll=r;
  if(r===6){sixes++;if(sixes===3){G===L&&info('Teen baar 6! Baari khatam');SFX.bad();await sleep(900);sixes=0;nextTurn(G);continue}}
  const mv=[0,1,2,3].filter(t=>canMove(p,t,r));
  if(!mv.length){G===L&&info(p.bot?'':'Koi chaal nahi');await sleep(700);if(r===6)continue;sixes=0;nextTurn(G);continue}
  let t;
  // unique positions only
  const uniq=[...new Set(mv.map(t=>p.t[t]))];
  if(p.bot){await sleep(400);if(!alive())return;t=botPick(G,p,mv,r)}
  else if(uniq.length===1){t=mv[0];await sleep(250)}
  else{G.movable=mv;G.state='wpick';G===L&&info('Goti chuno');t=await new Promise(res=>G.res=res);G.movable=[];if(!alive())return}
  G.state='moving';const bonus=await moveTok(G,p,t,r);if(!alive())return;
  if(p.t.every(v=>v===56)&&!p.rank){p.rank=++G.ranks;SFX.win();G===L&&info(p.name+' ghar pahuch gaya! 🏆');await sleep(900);if(!alive()||checkEnd())return}
  if((r===6||bonus)&&!p.rank)continue;
  sixes=0;nextTurn(G)}}
function nextTurn(G){G.turn=(G.turn+1)%G.players.length}
async function moveTok(G,p,t,r){const k=G.players.indexOf(p);
 if(p.t[t]===-1){p.t[t]=0;SFX.step();await sleep(200)}
 else for(let i=0;i<r;i++){const from=tokPos(p.ci,p.t[t]);p.t[t]++;const to=tokPos(p.ci,p.t[t]);
  for(let f=1;f<=5;f++){G.anim={k,t,pos:[from[0]+(to[0]-from[0])*f/5,from[1]+(to[1]-from[1])*f/5-Math.sin(f/5*Math.PI)*.35]};await sleep(22)}G.anim=null;SFX.step();buzz(10)}
 const v=p.t[t];if(v===56){SFX.home();return true}
 const cell=absCell(p.ci,v);if(cell<0||SAFE.includes(cell))return false;
 let cut=false;G.players.forEach(q=>{if(q===p||(G.mode==='team'&&q.team===p.team))return;q.t.forEach((w,j)=>{if(absCell(q.ci,w)===cell){q.t[j]=-1;cut=true}})});
 if(cut){SFX.cut();buzz(120);G===L&&info('✂️ Kaat diya!');await sleep(500)}return cut}
function botPick(G,p,mv,r){let best=mv[0],bs=-1e9;
 mv.forEach(t=>{const v=p.t[t],nv=v===-1?0:v+r;let s=0;const cell=absCell(p.ci,nv);
  if(nv===56)s+=80;if(v===-1)s+=60;
  if(cell>=0&&!SAFE.includes(cell))G.players.forEach(q=>{if(q!==p&&!(G.mode==='team'&&q.team===p.team))q.t.forEach(w=>{if(absCell(q.ci,w)===cell)s+=100})});
  if(cell>=0&&SAFE.includes(cell))s+=25;if(nv>50)s+=30;
  // danger
  if(cell>=0&&!SAFE.includes(cell))G.players.forEach(q=>{if(q!==p&&!(G.mode==='team'&&q.team===p.team))q.t.forEach(w=>{const c2=absCell(q.ci,w);if(c2>=0){const d=(cell-c2+52)%52;if(d>0&&d<=6)s-=40}})});
  s+=nv*.5+Math.random()*5;if(s>bs){bs=s;best=t}});return best}
function checkEnd(){const me=L.players.find(p=>!p.bot);let end=false,win=false;
 if(L.mode==='team'){const tA=L.players.filter(p=>p.team===0),tB=L.players.filter(p=>p.team===1);if(tA.every(p=>p.rank)){end=true;win=true}else if(tB.every(p=>p.rank)){end=true}}
 else if(L.mode==='pass'){end=L.players.filter(p=>!p.rank).length<=1}
 else{if(me.rank){end=true;win=me.rank===1}else if(L.players.filter(p=>!p.rank).length<=1)end=true;else if(L.players.length===2)end=true}
 if(!end)return false;L.over=true;setAct();
 const order=[...L.players].sort((a,b)=>(a.rank||9)-(b.rank||9));
 let prize=0;if(L.mode!=='pass'){if(win){prize=L.tour?3000:L.mode==='team'?800:500;D.wins.ludo++;addXp(30)}else addXp(10);if(prize)addCoins(prize)}
 SFX[win||L.mode==='pass'?'win':'bad']();
 setTimeout(()=>{modal(`<h2>${L.mode==='pass'?'RESULT':win?'AAP JEET GAYE!':'HAAR GAYE'}</h2><div class="res"><div class="big">${win||L.mode==='pass'?'🏆':'😔'}</div>${order.map((p,i)=>`<div class="srow" style="color:#fff"><span>${['🥇','🥈','🥉','4️⃣'][i]} ${AVS[p.av]} ${p.name}</span><span style="color:${LC[p.ci]}">●</span></div>`).join('')}${prize?`<div class="t gold">+${prize} 🪙</div>`:''}<button class="btn" id="again">Phir se khelo</button><button class="btn y" data-act="ludo">Home</button></div>`);
  $('#again').onclick=()=>{closeModal();const o={mode:L.mode,n:L.players.length,me:(L.players.find(p=>!p.bot)||{ci:0}).ci,names:L.players.map(p=>p.name),tour:0};startLudo(o)}},700);return true}

function cellXY(n){const r=Math.floor((n-1)/10);let c=(n-1)%10;if(r%2)c=9-c;return[c+.5,9-r+.5]}
function drawSnBoard(c,W){const s=W/10;
 for(let n=1;n<=100;n++){const[x,y]=cellXY(n);c.fillStyle=CELLC[(Math.floor(x)+Math.floor(y))%5];c.fillRect((x-.5)*s,(y-.5)*s,s,s);c.fillStyle='#0007';c.font=`bold ${s*.26}px sans-serif`;c.fillText(n,(x-.45)*s,(y-.18)*s)}
 c.strokeStyle='#0002';c.lineWidth=1;for(let i=0;i<=10;i++){c.beginPath();c.moveTo(i*s,0);c.lineTo(i*s,W);c.moveTo(0,i*s);c.lineTo(W,i*s);c.stroke()}
 // ladders
 Object.entries(LAD).forEach(([a,b])=>{const[x1,y1]=cellXY(+a),[x2,y2]=cellXY(+b);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*.2,ny=dx/len*.2;
  c.lineCap='round';c.strokeStyle='#6d3b12';c.lineWidth=s*.11;[1,-1].forEach(k=>{c.beginPath();c.moveTo((x1+nx*k)*s,(y1+ny*k)*s);c.lineTo((x2+nx*k)*s,(y2+ny*k)*s);c.stroke()});
  c.strokeStyle='#c98a3c';c.lineWidth=s*.07;[1,-1].forEach(k=>{c.beginPath();c.moveTo((x1+nx*k)*s,(y1+ny*k)*s);c.lineTo((x2+nx*k)*s,(y2+ny*k)*s);c.stroke()});
  const rungs=Math.floor(len*2.2);c.strokeStyle='#8a5020';c.lineWidth=s*.07;for(let i=1;i<rungs;i++){const f=i/rungs,px=x1+dx*f,py=y1+dy*f;c.beginPath();c.moveTo((px+nx)*s,(py+ny)*s);c.lineTo((px-nx)*s,(py-ny)*s);c.stroke()}});
 // snakes
 const sk=['#2e9e3e','#7b3fbf','#e57a00','#c62828','#1565c0'];let si=0;
 Object.entries(SNK).forEach(([a,b])=>{const[hx,hy]=cellXY(+a),[tx,ty]=cellXY(+b);const col=sk[si++%5];const dx=tx-hx,dy=ty-hy,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
  const pts=[];const N=40;for(let i=0;i<=N;i++){const f=i/N,w=Math.sin(f*Math.PI*3)*.45*(1-f*.3);pts.push([hx+dx*f+nx*w,hy+dy*f+ny*w])}
  for(let pass=0;pass<2;pass++){for(let i=0;i<N;i++){const f=i/N;c.strokeStyle=pass?(i%4<2?col:'#ffe066'):'#0006';c.lineWidth=s*(.34-f*.24)+(pass?0:s*.05);c.lineCap='round';c.beginPath();c.moveTo(pts[i][0]*s,pts[i][1]*s);c.lineTo(pts[i+1][0]*s,pts[i+1][1]*s);c.stroke()}}
  // head
  c.save();c.translate(hx*s,hy*s);c.rotate(Math.atan2(pts[1][1]-pts[0][1],pts[1][0]-pts[0][0])+Math.PI);c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.3,s*.22,0,0,7);c.fill();c.strokeStyle='#0005';c.lineWidth=2;c.stroke();
  [-1,1].forEach(k=>{c.fillStyle='#fff';c.beginPath();c.arc(s*.08,k*s*.1,s*.075,0,7);c.fill();c.fillStyle='#000';c.beginPath();c.arc(s*.1,k*s*.1,s*.035,0,7);c.fill()});
  c.strokeStyle='#e0245e';c.lineWidth=s*.04;c.beginPath();c.moveTo(s*.28,0);c.lineTo(s*.45,0);c.lineTo(s*.52,-s*.05);c.moveTo(s*.45,0);c.lineTo(s*.52,s*.05);c.stroke();c.restore()});
 c.lineWidth=s*.08;c.strokeStyle='#5a0b08';c.strokeRect(0,0,W,W);
 const[fx,fy]=cellXY(100);c.font=`${s*.5}px sans-serif`;c.fillText('🏁',(fx-.25)*s,(fy+.3)*s)}

 S={id:my,mode:o.mode,players:Array.from({length:o.n},(_,k)=>{const human=o.mode==='pass'||k===0;return{ci:k,name:o.mode==='pass'?(o.names&&o.names[k]||'Player '+(k+1)):human?D.name:bn[k],av:human&&o.mode!=='pass'?D.av:rnd(AVS.length),bot:!human,pos:0,disp:null}}),turn:0,over:false};

 function reset(){p={lane:0,x:0,y:0,vy:0,roll:0,run:0};objs=[];speed=13;dist=0;coins=0;spawnZ=30;mag=0;board=0;inv=0;score=0;mult=1+Math.floor(level()/5);intro=2.5;$('#rmult').textContent='x'+mult}

 function hit(){if(inv>0)return;if(board>0){board=0;inv=1.5;SFX.cut();buzz(80);$('#rmsg').textContent='🛹 Board toot gaya!';setTimeout(()=>$('#rmsg').textContent='',900);return}over()}
 function loop(now){if(cur!=='rgame')return;const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(st==='run'){speed=Math.min(34,13+dist*.012);dist+=speed*dt;score+=speed*dt*mult;intro=Math.max(0,intro-dt);
